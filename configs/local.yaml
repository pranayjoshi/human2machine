runtime:
  schema_version: "1.0.0"
  producer_version: "0.1.0"
  machine_mode: simulator_only
  ports:
    adapter_push: "tcp://127.0.0.1:5555"
    normalized_pub: "tcp://127.0.0.1:5556"
    command_push: "tcp://127.0.0.1:5557"
    control_rep: "tcp://127.0.0.1:5558"
    console_api: 8000
    developer_console: 3000
  heartbeat_seconds: 2
  max_event_bytes: 262144
  degraded_missed_heartbeats: 2
  offline_missed_heartbeats: 5

devices:
  crown:
    enabled: true
    mock: false
    # BrainFlow Crown OSC listens on UDP 9000. ip_address is not used.
    ip_address: null
    ip_port: 9000
    device_id: "Crown-995"
  ganglion:
    enabled: true
    mock: false
    # usb_dongle (BLED112 serial) or ble (native Bluetooth, no dongle).
    transport: ble
    # USB only. Do not commit machine-specific ports.
    serial_port: null
    # Optional BLE MAC / CoreBluetooth UUID. Empty = autodiscover Ganglion/Simblee.
    mac_address: 5D8A590C-9B3F-C6BD-F320-A756A08B91E8
    serial_number: null
    timeout_seconds: 15
  audio:
    enabled: true
    mock: false
    device_name: null
    sample_rate_hz: 16000
  vision:
    enabled: true
    mock: false
    camera_index: 0
    width: 1280
    height: 720
    fps: 30
  simulator:
    enabled: true

storage:
  sessions_dir: data/sessions
  fixtures_dir: data/fixtures
  record_audio: false
  record_video: false
